
training: 
  train_batch_size : 10
  out_dir : "/data/checkpoints"
  eval_interval : 2000
  log_interval : 100
  eval_iters : 200
  eval_only : false
  always_save_checkpoint : true
  gradient_accumulation_steps : 6
  learning_rate: 3.0e-4
  decay_lr : True
  warmup_iters : 1500
  lr_decay_iters : 1000
  min_lr : 6e-5 
  compile : true
  display_model_output_iter : 768
  use_cce : false # to use cut cross entropy or not
  scheduler: "cosine"
  init_from:  "scratch"
  max_batch_size : 16
  use_cut_cross_entropy: false
  enable_generation_during_training: true
  dtype: "bfloat16"
  compile_model: true
  optimizer_type : "adamw"
  max_iters : 600000  # total number of training iterations
  weight_decay : 1.0e-1
  beta1 : 0.9
  beta2 : 0.95
  grad_clip : 1.0
  log_grad_norm: true
  log_weights: True  
  log_system_metrics:  True
  log_moe_metrics: True  
  log_attention_metrics: True 
  monitor_interval: 50
  device: "cuda"
  gemm_impl: "bf16"
  use_custom_causal_mask: true


wandb: 
  log : true
  project : sabiyarn-ablations
  wandb_entity: "damilojohn"
  wandb_run_name : GQA_FSDP_DISTRIBUTED
  save_model_to_wandb: true
  eval_interval: 2000
  log_interval: 100
  run_dir: null
  seed: 42
  out_dir: "out"

# data
data: 
  datasets: "Aletheia-ng/pretrain_test"
  train_data_path : "/data/train.bin"
  eval_data_path : "/data/val.bin"
  out_dir: "/data/checkpoints"
  overwrite_data: false
  rehash: false

# model
model:
  vocab_size : 64000
  n_layers : 8
  n_heads : 8
  dropout : 0.0  # for pretraining 0 is good, for finetuning try 0.1+
  bias : False  # do we use bias inside LayerNorm and Linear layers?
  dim : 768
  n_kv_heads : 4
  multiple_of : 256  # make SwiGLU hidden layer size multiple of large power of 2
  ffn_dim_multiplier : None
  norm_eps : 1.0e-5
  #moe
  use_moe : true
  n_routed_experts: 3
  n_activated_experts: 1
  moe_inter_dim: 1536
  n_shared_experts: 2
  score_function: "softmax" #"sigmoid"- I think softmax is preferable
  bias_update_speed: 0.001
  moe_aux_loss_weight: 0.01

  use_logic_network: False
  use_j_linear: True
  tie_weights: True
  init_std: 0.02

  # Layer Sharing
  layer_sharing: False
  layer_sharing_strategy: "repeat_all_over" #"immediate"
  n_unique_layers: 8
  # cce
  use_cut_cross_entropy: false
  # Multi-Token Prediction
  use_multi_token_prediction: False
  num_prediction_tokens: 2
  mtp_only_training: True

  attention_type : "GQA"
  logic_network : False
  max_seq_len : 1024
  use_j : True
  num_experts : 3
  num_experts_per_tok : 1
  init_from : "scratch"  # 'scratch' or 'checkpoint'
  layer_norm_epsilon: 1.0e-6
  max_position_embeddings: 131072
  initializer_range: 0.02
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: false
  attention_dropout: 0.0
  tokenizer:
    name: "Aletheia-ng/SabiYarn_test"
    num_proc: 64
    process_one_file_at_a_time: True

# adamw optimizer
optimizer:
  name : "adam"
  learning_rate : 3e-4  # max learning rate
  max_iters : 600000  # total number of training iterations
  weight_decay : 1e-1
  beta1 : 0.9
  beta2 : 0.95
  grad_clip : 1.0  # clip gradients at this value, or disable if :: 0.0


# DDP settings
distributed:
  dist: true
  dist_strategy: "zero-3"
  rank : 0
  world_size: 2
  backend : "nccl"

#Accelerate config
accelerate: 
  mixed_precision: "fp16"
  zero_stage: 3
  gradient_clipping: 1.0


# Hashing registry for data deduplication
hash:
  hash_algo: "md5"
  registry_cache: "/data/global_hash_registry.lmdb"
  map_size_gb:  50
